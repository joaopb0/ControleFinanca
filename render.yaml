services:
  # -------------------------------------------------------------
  # 1. SERVIÇO BACK-END (Node.js Express + MySQL)
  # -------------------------------------------------------------
  - type: web
    name: backend-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Cole aqui a URL de conexão do seu banco de dados MySQL
      - key: CLIENT_URL
        sync: false # Cole a URL pública do seu front-end (ex: https://frontend-client.onrender.com)

  # -------------------------------------------------------------
  # 2. SERVIÇO FRONT-END (React Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: frontend-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Regra SPA para o React redirecionar para index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://backend-api.onrender.com/api

  # -------------------------------------------------------------
  # 3. INTERFACE WEB DO BANCO DE DADOS (Adminer Web UI)
  # -------------------------------------------------------------
  - type: web
    name: database-interface
    runtime: image
    image:
      url: adminer:latest
    plan: free
    envVars:
      - key: ADMINER_DEFAULT_SERVER
        value: db
