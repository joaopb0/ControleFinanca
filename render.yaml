services:
  # -------------------------------------------------------------
  # 1. SERVIÇO BACK-END (Node.js Express + MySQL)
  # -------------------------------------------------------------
  - type: web
    name: backend-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - fromGroup: controle-financa-mysql
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromService:
          type: pserv
          name: mysql-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: CLIENT_URL
        value: https://frontend-client-f4fn.onrender.com

  # -------------------------------------------------------------
  # 2. SERVIÇO FRONT-END (React Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: frontend-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Regra SPA para o React redirecionar para index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://backend-api-ayj9.onrender.com/api

  # -------------------------------------------------------------
  # 3. BANCO DE DADOS MYSQL (servico privado com disco persistente)
  # -------------------------------------------------------------
  - type: pserv
    name: mysql-db
    runtime: image
    image:
      url: mysql:8.4
    plan: 0.5c-512mb
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - fromGroup: controle-financa-mysql
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
