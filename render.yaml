services:
  # -------------------------------------------------------------
  # 1. SERVIÇO BACK-END (Node.js Express + MySQL efêmero)
  # -------------------------------------------------------------
  - type: web
    name: backend-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - fromGroup: controle-financa-mysql
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: MYSQL_ROOT_HOST
        value: localhost
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: CLIENT_URL
        value: https://frontend-client-4ygg.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: COOKIE_SAME_SITE
        value: none
      - key: MYSQL_EMBEDDED
        value: "true"

  # -------------------------------------------------------------
  # 2. SERVIÇO FRONT-END (React Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: frontend-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Regra SPA para o React redirecionar para index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://backend-api-pe6o.onrender.com/api
