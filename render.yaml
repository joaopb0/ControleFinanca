services:
  # -------------------------------------------------------------
  # 1. SERVIÇO BACK-END (Node.js Express + MySQL)
  # -------------------------------------------------------------
  - type: web
    name: backend-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Cole aqui a URL de conexão do seu banco MySQL
      - key: CLIENT_URL
        fromService:
          type: static
          name: frontend-client
          property: host

  # -------------------------------------------------------------
  # 2. SERVIÇO FRONT-END (React Vite Static Site)
  # -------------------------------------------------------------
  - type: static
    name: frontend-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # Regra SPA para o React Router redirecionar para index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend-api
          property: host
          path: /api

  # -------------------------------------------------------------
  # 3. INTERFACE WEB DO BANCO DE DADOS (Adminer Web UI)
  # -------------------------------------------------------------
  - type: web
    name: database-interface
    runtime: image
    image:
      url: adminer:latest
    plan: free
    envVars:
      - key: ADMINER_DEFAULT_SERVER
        value: db
